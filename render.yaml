services:
  - type: web
    name: aesthetic-study-space-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: AestheticStudySpace
      - key: Jwt__Audience
        value: AestheticStudySpace.Client
      - key: Cors__AllowedOrigins__0
        value: https://aestheticspaceproject.vercel.app
      - key: Cors__AllowedOrigins__1
        value: https://aestheticspaceprojectpreview.vercel.app
      - key: Database__Provider
        value: SqlServer

var corsOrigins = builder.Configuration.GetSection("Cors:AllowedOrigins").Get<string[]>()
    ?? new[] { "http://localhost:5173", "http://localhost:3000" };

// ❌ XÓA cái này (AddCors thứ 2):
// builder.Services.AddCors(options =>
// {
//     options.AddPolicy("AllowFrontend", ...)
// });

// ✅ GIỮ cái này và đổi tên nó:
builder.Services.AddCors(options =>
{
    options.AddPolicy("AllowFrontend", policy =>  // Đổi "Frontend" thành "AllowFrontend"
    {
        policy.WithOrigins(corsOrigins)
            .AllowAnyHeader()
            .AllowAnyMethod()
            .AllowCredentials();
    });
});

// Trong app:
app.UseCors("AllowFrontend");  // ✅ Chỉ cần 1 cái này
// ❌ Xóa dòng: app.UseCors("Frontend");
