services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: "8080"
      Database__Provider: PostgreSQL
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=aesthetic_study_space;Username=postgres;Password=postgres
      Jwt__Secret: "change-me-please-change-me-please-change-me"
      Jwt__Issuer: "AestheticStudySpace"
      Jwt__Audience: "AestheticStudySpace.Client"
      Jwt__AccessTokenMinutes: "60"
      Swagger__Enabled: "true"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      App__FrontendBaseUrl: "http://localhost:5173"
      Cloudinary__CloudName: ""
      Cloudinary__ApiKey: ""
      Cloudinary__ApiSecret: ""
      GoogleAuth__ClientId: ""
      VNPay__TmnCode: ""
      VNPay__HashSecret: ""
      SePay__WebhookSecret: ""
      Smtp__Host: ""
      Smtp__Port: "587"
      Smtp__EnableSsl: "true"
      Smtp__Username: ""
      Smtp__Password: ""
      Smtp__FromEmail: ""
      Smtp__FromName: "Aesthetic Study Space"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aesthetic_study_space
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aesthetic_study_space"]
      interval: 5s
      timeout: 5s
      retries: 20

